<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>budgetCasa — Icon Generator</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0A0F0D;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 60px 40px;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      gap: 52px;
    }

    .header { text-align: center; }
    .header h1 {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: #22C55E;
      margin-bottom: 10px;
    }
    .header p { font-size: 28px; color: white; font-weight: 300; letter-spacing: -0.5px; }

    .previews {
      display: flex;
      align-items: flex-end;
      gap: 48px;
    }

    .preview-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .preview-item svg {
      border-radius: 22%;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5), 0 0 0 1px rgba(255,255,255,0.04);
    }

    .preview-label {
      font-size: 11px;
      color: #3a4a3e;
      letter-spacing: 1.5px;
      text-transform: uppercase;
    }

    .actions { display: flex; gap: 12px; }

    .btn {
      border: none;
      padding: 14px 28px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      letter-spacing: 0.3px;
      transition: all 0.2s;
    }

    .btn-primary {
      background: #065F46;
      color: white;
    }
    .btn-primary:hover { background: #086B4F; transform: translateY(-1px); }

    .btn-secondary {
      background: #1a2a1e;
      color: #22C55E;
      border: 1px solid #1d3a24;
    }
    .btn-secondary:hover { background: #1d3a24; }

    .instructions {
      color: #3a4a3e;
      font-size: 12px;
      text-align: center;
      line-height: 2;
      max-width: 500px;
    }
    .instructions strong { color: #4a6a50; }
    .instructions code {
      background: #0f1f12;
      color: #22C55E;
      padding: 2px 6px;
      border-radius: 4px;
      font-family: 'SF Mono', 'Fira Code', monospace;
      font-size: 11px;
    }
  </style>
</head>
<body>

  <div class="header">
    <h1>App Icon · 1024 × 1024</h1>
    <p>budgetCasa</p>
  </div>

  <div class="previews">

    <!-- 256px -->
    <div class="preview-item">
      <svg id="icon256" width="256" height="256" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <clipPath id="clip"><rect width="1024" height="1024" rx="225" ry="225"/></clipPath>
          <linearGradient id="bg" x1="0" y1="0" x2="900" y2="1024" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="#0D8A5C"/>
            <stop offset="55%"  stop-color="#065F46"/>
            <stop offset="100%" stop-color="#022E20"/>
          </linearGradient>
          <radialGradient id="shine" cx="260" cy="190" r="480" gradientUnits="userSpaceOnUse">
            <stop offset="0%"   stop-color="white" stop-opacity="0.14"/>
            <stop offset="65%"  stop-color="white" stop-opacity="0.02"/>
            <stop offset="100%" stop-color="white" stop-opacity="0"/>
          </radialGradient>
          <linearGradient id="houseFade" x1="0" y1="0" x2="0" y2="1" gradientUnits="objectBoundingBox">
            <stop offset="0%"   stop-color="white" stop-opacity="1"/>
            <stop offset="100%" stop-color="white" stop-opacity="0.93"/>
          </linearGradient>
          <filter id="houseShadow" x="-5%" y="-5%" width="110%" height="115%">
            <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000" flood-opacity="0.18"/>
          </filter>
        </defs>

        <g clip-path="url(#clip)">
          <!-- BG -->
          <rect width="1024" height="1024" fill="url(#bg)"/>

          <!-- Subtle geometric grid lines -->
          <g opacity="0.035" stroke="white" stroke-width="1">
            <line x1="0"    y1="256"  x2="1024" y2="256"/>
            <line x1="0"    y1="512"  x2="1024" y2="512"/>
            <line x1="0"    y1="768"  x2="1024" y2="768"/>
            <line x1="256"  y1="0"    x2="256"  y2="1024"/>
            <line x1="512"  y1="0"    x2="512"  y2="1024"/>
            <line x1="768"  y1="0"    x2="768"  y2="1024"/>
          </g>

          <!-- ════ HOUSE ════ -->
          <g filter="url(#houseShadow)">

            <!-- Chimney (draw behind roof) -->
            <rect x="670" y="118" width="50" height="112"
              fill="url(#houseFade)" rx="6" ry="6"/>

            <!-- Chimney cap (slight dark line) -->
            <rect x="664" y="118" width="62" height="10"
              fill="white" opacity="0.6" rx="3"/>

            <!-- Roof -->
            <polygon
              points="512,150  162,452  862,452"
              fill="url(#houseFade)"/>

            <!-- Roof ridge line (subtle depth) -->
            <polygon
              points="512,150  162,452  512,430  862,452"
              fill="white" opacity="0.08"/>

            <!-- House body -->
            <rect x="208" y="452" width="608" height="396"
              fill="url(#houseFade)" rx="0"/>
          </g>

          <!-- ════ OPENINGS (emerald cutouts) ════ -->

          <!-- Left window -->
          <rect x="258" y="508" width="128" height="108"
            fill="#054534" rx="14" opacity="0.88"/>

          <!-- Window pane cross (subtle) -->
          <line x1="322" y1="508" x2="322" y2="616" stroke="white" stroke-width="3" opacity="0.12"/>
          <line x1="258" y1="562" x2="386" y2="562" stroke="white" stroke-width="3" opacity="0.12"/>

          <!-- Right window -->
          <rect x="638" y="508" width="128" height="108"
            fill="#054534" rx="14" opacity="0.88"/>

          <!-- Inside right window: mini bar chart (ascending trend) -->
          <rect x="653" y="581" width="14" height="24" rx="2" fill="#22C55E" opacity="0.7"/>
          <rect x="673" y="568" width="14" height="37" rx="2" fill="#22C55E" opacity="0.7"/>
          <rect x="693" y="556" width="14" height="49" rx="2" fill="#22C55E" opacity="0.7"/>
          <rect x="713" y="542" width="14" height="63" rx="2" fill="#22C55E" opacity="0.85"/>
          <rect x="733" y="528" width="14" height="77" rx="2" fill="#22C55E" opacity="0.9"/>

          <!-- Door (arched) -->
          <rect x="446" y="640" width="132" height="208"
            fill="#054534" rx="66" opacity="0.92"/>

          <!-- Door handle -->
          <circle cx="556" cy="752" r="9" fill="white" opacity="0.25"/>

          <!-- ════ EFFECTS ════ -->

          <!-- Light reflex (top-left glow) -->
          <rect width="1024" height="1024" fill="url(#shine)"/>

          <!-- Bottom vignette -->
          <rect width="1024" height="200" y="824"
            fill="black" opacity="0.08"/>

          <!-- Inner border stroke -->
          <rect width="1024" height="1024" rx="225" ry="225"
            fill="none" stroke="white" stroke-width="2" stroke-opacity="0.07"/>
        </g>
      </svg>
      <span class="preview-label">256px</span>
    </div>

    <!-- 128px -->
    <div class="preview-item">
      <svg width="128" height="128" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <g clip-path="url(#clip)">
          <rect width="1024" height="1024" fill="url(#bg)"/>
          <rect x="670" y="118" width="50" height="112" fill="white" rx="6"/>
          <polygon points="512,150 162,452 862,452" fill="white"/>
          <rect x="208" y="452" width="608" height="396" fill="white"/>
          <rect x="258" y="508" width="128" height="108" fill="#054534" rx="14" opacity="0.88"/>
          <rect x="638" y="508" width="128" height="108" fill="#054534" rx="14" opacity="0.88"/>
          <rect x="446" y="640" width="132" height="208" fill="#054534" rx="66" opacity="0.92"/>
          <rect width="1024" height="1024" fill="url(#shine)"/>
          <rect width="1024" height="1024" rx="225" ry="225" fill="none" stroke="white" stroke-width="2" stroke-opacity="0.07"/>
        </g>
      </svg>
      <span class="preview-label">128px</span>
    </div>

    <!-- 64px -->
    <div class="preview-item">
      <svg width="64" height="64" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <g clip-path="url(#clip)">
          <rect width="1024" height="1024" fill="url(#bg)"/>
          <polygon points="512,150 162,452 862,452" fill="white"/>
          <rect x="208" y="452" width="608" height="396" fill="white"/>
          <rect x="258" y="508" width="128" height="108" fill="#054534" rx="14" opacity="0.88"/>
          <rect x="638" y="508" width="128" height="108" fill="#054534" rx="14" opacity="0.88"/>
          <rect x="446" y="640" width="132" height="208" fill="#054534" rx="66" opacity="0.92"/>
          <rect width="1024" height="1024" fill="url(#shine)"/>
        </g>
      </svg>
      <span class="preview-label">64px</span>
    </div>

    <!-- 32px -->
    <div class="preview-item">
      <svg width="32" height="32" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
        <g clip-path="url(#clip)">
          <rect width="1024" height="1024" fill="url(#bg)"/>
          <polygon points="512,150 162,452 862,452" fill="white"/>
          <rect x="208" y="452" width="608" height="396" fill="white"/>
          <rect x="446" y="640" width="132" height="208" fill="#054534" rx="66" opacity="0.92"/>
        </g>
      </svg>
      <span class="preview-label">32px</span>
    </div>

  </div>

  <div class="actions">
    <button class="btn btn-primary" onclick="download('icon.png')">
      ⬇ Télécharger icon.png
    </button>
    <button class="btn btn-secondary" onclick="download('adaptive-icon.png')">
      ⬇ adaptive-icon.png
    </button>
    <button class="btn btn-secondary" onclick="download('splash-icon.png')">
      ⬇ splash-icon.png
    </button>
  </div>

  <p class="instructions">
    Télécharge les 3 fichiers et remplace-les dans <code>assets/</code><br>
    <strong>icon.png</strong> → utilisé par iOS · App Store<br>
    <strong>adaptive-icon.png</strong> → utilisé par Android<br>
    <strong>splash-icon.png</strong> → écran de chargement<br><br>
    Puis relance : <code>npx expo start</code>
  </p>

  <script>
    function download(filename) {
      const svg = document.getElementById('icon256');
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 1024;
      const ctx = canvas.getContext('2d');

      // Serialize SVG with all defs from document
      const svgClone = svg.cloneNode(true);
      svgClone.setAttribute('width', '1024');
      svgClone.setAttribute('height', '1024');

      // Include all defs
      const defs = document.querySelector('defs');
      if (defs && !svgClone.querySelector('defs')) {
        svgClone.insertBefore(defs.cloneNode(true), svgClone.firstChild);
      }

      const svgData = new XMLSerializer().serializeToString(svgClone);
      const svgBlob = new Blob([svgData], { type: 'image/svg+xml;charset=utf-8' });
      const url = URL.createObjectURL(svgBlob);

      const img = new Image();
      img.onload = () => {
        ctx.drawImage(img, 0, 0, 1024, 1024);
        URL.revokeObjectURL(url);
        canvas.toBlob(blob => {
          const a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = filename;
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
        }, 'image/png');
      };
      img.onerror = () => {
        alert('Erreur: ouvre ce fichier depuis un serveur local.\nDans le terminal: npx serve . \nPuis va sur http://localhost:3000/generate-icon.html');
        URL.revokeObjectURL(url);
      };
      img.src = url;
    }
  </script>
</body>
</html>
